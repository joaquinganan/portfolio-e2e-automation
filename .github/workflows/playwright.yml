name: Playwright Tests
run-name: QA Lab - ${{ inputs.request_id || github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the portfolio QA Lab
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests (production)
      run: npm run test:prod
      env:
        BASE_URL: https://joaquinganan.dev

    - name: Record representative browser replay
      if: success()
      run: node scripts/record-portfolio-replay.mjs
      env:
        BASE_URL: https://joaquinganan.dev

    - name: Upload browser replay
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: browser-replay
        path: replay-output/portfolio-browser-replay.webm
        retention-days: 14

    - name: Publish latest browser replay
      if: success() && github.event_name != 'pull_request'
      run: |
        mkdir -p /tmp/portfolio-replay
        cp replay-output/portfolio-browser-replay.webm /tmp/portfolio-replay/
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch --orphan replay-assets
        git rm -rf .
        cp /tmp/portfolio-replay/portfolio-browser-replay.webm .
        git add portfolio-browser-replay.webm
        git commit -m "Update browser replay for run #${GITHUB_RUN_NUMBER}"
        git push --force origin replay-assets

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 14
