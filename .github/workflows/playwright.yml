name: Playwright Tests
run-name: QA Lab - ${{ inputs.request_id || github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the portfolio QA Lab
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci

    - name: Check QA Lab coverage file is current
      run: npm run coverage:check

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests (production)
      run: npm run test:prod
      env:
        BASE_URL: https://joaquinganan.dev

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 14
